<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Festival Tracker</title>
    <link rel="stylesheet" href="./styles.css?v=20260520-cinematheque" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to Content</a>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>Festival Tracker</h1>
          <p id="generatedAt">Loading data...</p>
        </div>
        <div class="summary-line" aria-label="Summary">
          <span class="metric-card"><strong id="metricAvailable">0</strong><small>Available</small></span>
          <span class="metric-card"><strong id="metricFilms">0</strong><small>Films</small></span>
          <span class="metric-card"><strong id="metricReview">0</strong><small>Review</small></span>
          <span class="metric-card"><strong id="metricEvents">0</strong><small>Events</small></span>
        </div>
        <nav class="tabs" aria-label="Views">
          <button class="tab active" data-view="available">Available</button>
          <button class="tab" data-view="all">All Films</button>
          <button class="tab" data-view="review">Review</button>
          <button class="tab" data-view="events">Finds</button>
        </nav>
      </header>

      <section class="controls" aria-label="Filters">
        <label>
          Search
          <input id="searchInput" name="search" type="search" autocomplete="off" placeholder="Title, director, section..." />
        </label>
        <details class="filter-drawer" open>
          <summary>Filters</summary>
          <div class="filter-fields">
            <label>
              Festival
              <select id="festivalFilter" name="festival"></select>
            </label>
            <label>
              Festival Year
              <select id="yearFilter" name="year"></select>
            </label>
            <label>
              Status
              <select id="statusFilter" name="status">
                <option value="">Any status</option>
                <option value="pending">Pending</option>
                <option value="available_found">Available found</option>
                <option value="needs_review">Needs review</option>
              </select>
            </label>
            <label>
              Sort
              <select id="sortSelect" name="sort">
                <option value="rating">Rating</option>
                <option value="available">Available date</option>
                <option value="festival">Festival</option>
                <option value="title">Title</option>
              </select>
            </label>
          </div>
        </details>
      </section>

      <main id="content" tabindex="-1">
        <section class="view-header" aria-live="polite">
          <div>
            <p id="viewKicker">Available</p>
            <h2 id="viewTitle">First legal availability</h2>
          </div>
          <span id="viewMeta">0 films</span>
        </section>
        <section id="spotlight" class="spotlight" aria-live="polite"></section>
        <section id="filmGrid" class="film-grid" aria-live="polite"></section>
        <section id="reviewTable" class="review-table hidden" aria-live="polite"></section>
        <section id="eventList" class="event-list hidden" aria-live="polite"></section>
      </main>
    </div>

    <aside id="detailPanel" class="detail-panel" aria-hidden="true">
      <button id="closeDetail" class="close-button" aria-label="Close detail">x</button>
      <div id="detailContent"></div>
    </aside>
    <div id="overlay" class="overlay hidden"></div>

    <script src="./build-meta.js?v=20260520-cache"></script>
    <script src="./app.js?v=20260520-card-meta-cleanup"></script>
  </body>
</html>
