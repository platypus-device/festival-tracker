name: Festival Legal Availability Tracker

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Tracker mode"
        required: true
        type: choice
        options:
          - Availability
          - Lineups
          - All
        default: Availability
      respect_festival_windows:
        description: "Only fetch active lineup windows for Lineups/All"
        required: true
        type: boolean
        default: true
      config_path:
        description: "Tracker config path"
        required: false
        type: string
        default: "config/festivals.json"
  schedule:
    - cron: "30 23 * * *"
    - cron: "45 23 * * 1"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore availability records archived by policy cleanup
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[restore-availability]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          & ./scripts/Restore-AccidentallyArchivedPages.ps1 -Apply

      - name: Archive orphan films and events for removed source selections
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[cleanup-policy-events]')
        shell: pwsh
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CANONICAL_FILMS_DATABASE_ID: ${{ secrets.NOTION_CANONICAL_FILMS_DATABASE_ID }}
          NOTION_SELECTIONS_DATABASE_ID: ${{ secrets.NOTION_SELECTIONS_DATABASE_ID }}
          NOTION_EVENTS_DATABASE_ID: ${{ secrets.NOTION_EVENTS_DATABASE_ID }}
        run: |
          & ./scripts/Archive-PolicyAvailabilityEvents.ps1 -Apply -FilmTrackerIds @(
            "941ce1aa89ff8f83c7749109",
            "d4b273ff6aba55fb0b5a6c68",
            "ef62146f51d16f4da25844db",
            "771473776c24ab8ef47a9cc0"
          )

      - name: Set IMDb cache key
        if: github.event_name != 'push'
        shell: pwsh
        run: |
          $now = Get-Date
          $weekYear = [System.Globalization.ISOWeek]::GetYear($now)
          $week = [System.Globalization.ISOWeek]::GetWeekOfYear($now)
          $weekKey = "{0}-W{1:D2}" -f $weekYear, $week
          "IMDB_CACHE_KEY=imdb-ratings-$weekKey" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache IMDb datasets
        if: github.event_name != 'push'
        uses: actions/cache@v5
        with:
          path: .tracker/imdb
          key: ${{ env.IMDB_CACHE_KEY }}
          restore-keys: |
            imdb-ratings-

      - name: Sync tracker data
        if: github.event_name != 'push'
        shell: pwsh
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CANONICAL_FILMS_DATABASE_ID: ${{ secrets.NOTION_CANONICAL_FILMS_DATABASE_ID }}
          NOTION_SELECTIONS_DATABASE_ID: ${{ secrets.NOTION_SELECTIONS_DATABASE_ID }}
          NOTION_FILMS_DATABASE_ID: ${{ secrets.NOTION_FILMS_DATABASE_ID }}
          NOTION_EVENTS_DATABASE_ID: ${{ secrets.NOTION_EVENTS_DATABASE_ID }}
        run: |
          $mode = "${{ github.event.inputs.mode }}"
          $eventName = "${{ github.event_name }}"
          $schedule = "${{ github.event.schedule }}"
          $forceRespectWindows = $false

          if ($eventName -eq "schedule" -and $schedule -eq "45 23 * * 1") {
            $mode = "Lineups"
            $forceRespectWindows = $true
          }
          elseif ([string]::IsNullOrWhiteSpace($mode)) {
            $mode = "Availability"
          }

          $trackerArgs = @{
            Mode = $mode
            UseNotion = $true
            EnsureNotionSchema = $true
          }
          $configPath = "${{ github.event.inputs.config_path }}"
          if (-not [string]::IsNullOrWhiteSpace($configPath)) {
            $trackerArgs["ConfigPath"] = $configPath
          }
          $respectWindows = "${{ github.event.inputs.respect_festival_windows }}"
          if ($forceRespectWindows -or (($mode -eq "Lineups" -or $mode -eq "All") -and $respectWindows -ne "false")) {
            $trackerArgs["RespectFestivalWindows"] = $true
          }

          & ./scripts/Invoke-FestivalTracker.ps1 @trackerArgs
          if ($mode -eq "Lineups") {
            & ./scripts/Invoke-FestivalTracker.ps1 -Mode Availability -UseNotion
          }
          & ./scripts/Archive-OutOfScopeSelections.ps1 -Apply -ArchiveOrphanFilms
          & ./scripts/Repair-YearMetadata.ps1 -UseNotion -Apply
          & ./scripts/Export-TrackerData.ps1 -UseNotion
          & ./scripts/Test-TrackerDataQuality.ps1 -UseNotion -DataPath ./web/data/tracker-data.json

      - name: Export tracker data
        if: github.event_name == 'push'
        shell: pwsh
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CANONICAL_FILMS_DATABASE_ID: ${{ secrets.NOTION_CANONICAL_FILMS_DATABASE_ID }}
          NOTION_SELECTIONS_DATABASE_ID: ${{ secrets.NOTION_SELECTIONS_DATABASE_ID }}
          NOTION_FILMS_DATABASE_ID: ${{ secrets.NOTION_FILMS_DATABASE_ID }}
          NOTION_EVENTS_DATABASE_ID: ${{ secrets.NOTION_EVENTS_DATABASE_ID }}
        run: |
          & ./scripts/Archive-OutOfScopeSelections.ps1 -Apply -ArchiveOrphanFilms
          & ./scripts/Repair-YearMetadata.ps1 -UseNotion -Apply
          & ./scripts/Export-TrackerData.ps1 -UseNotion
          & ./scripts/Test-TrackerDataQuality.ps1 -UseNotion -DataPath ./web/data/tracker-data.json

      - name: Prepare Pages artifact
        shell: pwsh
        run: |
          $buildVersion = "${{ github.sha }}"
          $buildTime = (Get-Date).ToUniversalTime().ToString("o")
          @{
            buildVersion = $buildVersion
            buildTime = $buildTime
          } | ConvertTo-Json | Set-Content -Path ./web/build-meta.json -Encoding UTF8
          "window.FESTIVAL_TRACKER_BUILD = { version: '$buildVersion', time: '$buildTime' };" | Set-Content -Path ./web/build-meta.js -Encoding UTF8
          New-Item -ItemType File -Path ./web/.nojekyll -Force | Out-Null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
